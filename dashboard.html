<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">
    <div id="newBoardModal" class="modal">
        <div class="modal-content">
            <a href="#" class="close-modal">&times;</a>
            <h2>Новая доска</h2>
            <div class="input-box">
                <input type="text" placeholder="Название доски" required>
            </div>
            <div class="modal-buttons">
                <a href="#" class="modal-btn cancel">Отмена</a>
                <a href="dashboard.html" class="modal-btn save">Сохранить</a>
            </div>
        </div>
    </div>

    <div class="dashboard-container">
        <div class="header">
            <h1>Мои доски</h1>
            <a href="index.html" class="logout-btn">Выйти</a>
        </div>

        <div class="new-board-section">
            <a href="#newBoardModal" class="new-board-btn">+ Новая доска</a>
        </div>

        <div class="boards-grid">
            <a href="dashboard1.html" class="board-card board-card-1">
                <h3>Моя доска</h3>
                <p>3 списка</p>
            </a>
        </div>
    </div>
</body>
</html>
